<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Downloader</title>
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8;
  --accent: #2563eb; --accent-text: #fff; --ok: #16a34a; --err: #dc2626; --track: #e9e9ee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618; --card: #222225; --text: #f2f2f4; --muted: #9a9aa2; --line: #333338;
    --accent: #3b82f6; --ok: #22c55e; --err: #f87171; --track: #333338;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=text] { flex: 1 1 300px; min-width: 0; padding: 11px 12px; font-size: 15px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); outline: none; }
input[type=text]:focus { border-color: var(--accent); }
button, select { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
  color: var(--text); padding: 9px 14px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
button.link { border: none; background: none; padding: 4px 6px; color: var(--accent); }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.media { display: flex; gap: 14px; flex-wrap: wrap; }
.media img { width: 200px; max-width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--track); }
.media .meta { flex: 1 1 260px; min-width: 0; }
.media h2 { font-size: 16px; margin: 0 0 4px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; border-radius: 0; padding: 8px 16px; }
.seg button.on { background: var(--accent); color: var(--accent-text); }
.opts { margin: 12px 0; }
.list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow: auto; margin-top: 10px; }
.item { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job { padding: 12px 0; border-top: 1px solid var(--line); }
.job:first-child { border-top: none; }
.job .top { display: flex; gap: 8px; align-items: center; }
.job .t { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.bar.indet > i { width: 30% !important; animation: slide 1.2s infinite ease-in-out; }
@keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
.job.done .bar > i { background: var(--ok); }
.job.error .bar > i { background: var(--err); }
.small { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.err { color: var(--err); }
.hidden { display: none !important; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.head h3 { margin: 0; font-size: 15px; }
.settings { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.folder { flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Video Downloader</h1>
  <p class="sub">Paste a link to any web page with a video or audio. Works with YouTube, Vimeo, Reddit, TikTok, SoundCloud and most other sites.</p>

  <div class="card">
    <form id="form" class="row">
      <input id="url" type="text" placeholder="https://…" autocomplete="off" autofocus>
      <button class="primary" id="go" type="submit">Find media</button>
    </form>
    <div class="row" style="margin-top:10px">
      <label class="chk"><input type="checkbox" id="playlist"> Download whole playlist if the link is one</label>
    </div>
    <p id="status" class="small" style="margin:10px 0 0"></p>
  </div>

  <div class="card hidden" id="result"></div>

  <div class="card">
    <div class="head"><h3>Downloads</h3><button class="link" id="clear">Clear finished</button></div>
    <div id="jobs"><p class="muted" id="nojobs">Nothing yet.</p></div>
  </div>

  <div class="card">
    <div class="settings">
      <span>Save to:</span><span class="folder" id="folder"></span>
      <button id="choose">Change…</button>
      <button id="openFolder">Open</button>
    </div>
    <div class="settings" style="margin-top:10px">
      <span>Use login cookies from</span>
      <select id="cookies">
        <option value="none">No browser</option><option value="chrome">Chrome</option>
        <option value="safari">Safari</option><option value="firefox">Firefox</option>
        <option value="edge">Edge</option><option value="brave">Brave</option>
      </select>
      <span class="small">for private or sign-in-only videos</span>
    </div>
    <div class="settings" style="margin-top:10px">
      <span class="small" id="ver"></span>
      <button class="link" id="update">Update engine</button>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const api = (path, body) => fetch(path, body === undefined ? {} : {
  method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
}).then(r => r.json());
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = s => { if (!s && s !== 0) return ""; s = Math.round(s);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const fmtBytes = b => { if (!b) return ""; const u = ["B","KB","MB","GB"]; let i = 0;
  while (b >= 1024 && i < 3) { b /= 1024; i++; } return b.toFixed(i ? 1 : 0) + " " + u[i]; };

let state = { mode: "video", quality: "best", audio_fmt: "mp3", video_fmt: "mp4", info: null, ffmpeg: true };

// ---------- inspect ----------
$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const url = $("#url").value.trim();
  if (!url) return;
  $("#go").disabled = true;
  $("#status").innerHTML = '<span class="spinner"></span> Looking for media on the page…';
  $("#result").classList.add("hidden");
  try {
    const r = await api("/api/inspect", { url, playlist: $("#playlist").checked });
    if (!r.ok) { $("#status").innerHTML = '<span class="err">' + esc(r.error) + '</span>'; return; }
    $("#status").textContent = "";
    state.info = r;
    state.mode = r.type === "single" && r.has_video === false ? "audio" : "video";
    state.quality = "best";
    renderResult();
  } catch (err) {
    $("#status").innerHTML = '<span class="err">Something went wrong: ' + esc(err) + '</span>';
  } finally { $("#go").disabled = false; }
});

function optionsHTML(heights, hasVideo) {
  const qs = ["best", ...(heights?.length ? heights.filter((h,i,a) => a.indexOf(h) === i)
              : [2160, 1440, 1080, 720, 480, 360])];
  if (!qs.some(q => String(q) === String(state.quality))) state.quality = "best";
  return `
  <div class="opts row">
    <div class="seg">
      <button data-mode="video" class="${state.mode==="video"?"on":""}" ${hasVideo===false?"disabled":""}>Video</button>
      <button data-mode="audio" class="${state.mode==="audio"?"on":""}">Audio only</button>
    </div>
    <select id="quality" class="${state.mode==="video"?"":"hidden"}">
      ${qs.map(q => `<option value="${q}" ${String(q)===String(state.quality)?"selected":""}>${q==="best"?"Best quality":q+"p"}</option>`).join("")}
    </select>
    <select id="vfmt" class="${state.mode==="video"?"":"hidden"}">
      ${["mp4","mkv","webm"].map(f => `<option ${f===state.video_fmt?"selected":""}>${f}</option>`).join("")}
    </select>
    ${state.mode==="audio" && !state.ffmpeg ? `<span class="small">Saved in the site's original format (install ffmpeg to convert to MP3 etc.)</span>` : ""}
    <select id="afmt" class="${state.mode==="audio" && state.ffmpeg?"":"hidden"}">
      ${[["mp3","MP3"],["m4a","M4A (AAC)"],["opus","Opus"],["wav","WAV"],["flac","FLAC"],["original","Original"]]
        .map(([v,l]) => `<option value="${v}" ${v===state.audio_fmt?"selected":""}>${l}</option>`).join("")}
    </select>
  </div>`;
}

function renderResult() {
  const r = state.info, box = $("#result");
  let html = "";
  if (r.type === "single") {
    html = `<div class="media">
      ${r.thumbnail ? `<img src="${esc(r.thumbnail)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      <div class="meta">
        <h2>${esc(r.title)}</h2>
        <div class="muted">${esc([r.uploader, r.site, fmtTime(r.duration)].filter(Boolean).join(" · "))}</div>
        ${optionsHTML(r.heights, r.has_video)}
        <button class="primary" id="dl">Download</button>
      </div></div>`;
  } else {
    html = `<div class="head"><h3>${esc(r.title || "Playlist")}</h3><span class="muted">${r.entries.length} items</span></div>
      ${r.type === "scan" ? `<p class="small">The site isn't directly supported, so these are the media links found in the page.</p>` : ""}
      ${optionsHTML(null, true)}
      <div class="row">${r.type === "playlist" ? `<button class="primary" id="dlall">Download all</button>` : ""}</div>
      <div class="list">${r.entries.map((e,i) => `<div class="item">
        <span class="t" title="${esc(e.url)}">${esc(e.title)}</span>
        <button data-i="${i}" class="dlone">Download</button></div>`).join("")}</div>`;
  }
  box.innerHTML = html;
  box.classList.remove("hidden");
  bindOptions();
}

function bindOptions() {
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    state.mode = b.dataset.mode; renderResult(); });
  $("#quality") && ($("#quality").onchange = e => state.quality = e.target.value);
  $("#vfmt") && ($("#vfmt").onchange = e => state.video_fmt = e.target.value);
  $("#afmt") && ($("#afmt").onchange = e => state.audio_fmt = e.target.value);
  const r = state.info;
  const base = () => ({ mode: state.mode, quality: state.quality, audio_fmt: state.audio_fmt, video_fmt: state.video_fmt });
  if ($("#dl")) $("#dl").onclick = () => queue({ ...base(), url: r.url || $("#url").value.trim(), title: r.title });
  if ($("#dlall")) $("#dlall").onclick = () => queue({ ...base(), url: r.url, title: r.title, playlist: true });
  document.querySelectorAll(".dlone").forEach(b => b.onclick = () => {
    const e = r.entries[+b.dataset.i];
    queue({ ...base(), url: e.url, title: e.title, referer: r.type === "scan" ? r.url : undefined });
    b.textContent = "Added"; b.disabled = true;
  });
}

async function queue(p) { await api("/api/download", p); poll(); }

// ---------- jobs ----------
let timer = null;
async function poll() {
  clearTimeout(timer);
  const { jobs } = await api("/api/jobs");
  $("#nojobs").classList.toggle("hidden", jobs.length > 0);
  const box = $("#jobs");
  box.querySelectorAll(".job").forEach(el => { if (!jobs.find(j => j.id === el.dataset.id)) el.remove(); });
  for (const j of jobs.slice().reverse()) {
    let el = box.querySelector(`.job[data-id="${j.id}"]`);
    if (!el) { el = document.createElement("div"); el.className = "job"; el.dataset.id = j.id; box.prepend(el); }
    el.className = "job " + j.status;
    const active = ["queued","downloading","processing"].includes(j.status);
    const indet = j.status === "queued" || j.status === "processing" || (j.status === "downloading" && j.percent == null);
    let line = "";
    if (j.status === "queued") line = "Starting…";
    else if (j.status === "downloading") line = [j.percent != null ? j.percent.toFixed(1) + "%" : "",
      j.total ? fmtBytes(j.downloaded) + " of " + fmtBytes(j.total) : fmtBytes(j.downloaded),
      j.speed ? fmtBytes(j.speed) + "/s" : "", j.eta ? fmtTime(j.eta) + " left" : "",
      j.item && j.item[0] ? `item ${j.item[0]}${j.item[1] ? " of " + j.item[1] : ""}` : ""].filter(Boolean).join(" · ");
    else if (j.status === "processing") line = "Merging / converting…";
    else if (j.status === "done") line = "Saved" + (j.file ? ": " + j.file : "");
    else if (j.status === "cancelled") line = "Cancelled";
    else if (j.status === "error") line = '<span class="err">' + esc(j.error) + "</span>";
    // Rebuild markup only when status/file changes; otherwise update in place,
    // so buttons aren't replaced mid-click.
    const sig = j.status + "|" + (j.file || "");
    if (el.dataset.sig !== sig) {
      el.dataset.sig = sig;
      el.innerHTML = `<div class="top">
          <span class="t"></span>
          ${active ? `<button class="link" data-cancel="${j.id}">Cancel</button>` : ""}
          ${j.status === "done" ? `<button class="link" data-reveal="${esc(j.file || "")}">Show in Finder</button>` : ""}
        </div>
        <div class="bar"><i></i></div>
        <div class="small"></div>`;
    }
    const t = el.querySelector(".t");
    t.textContent = (j.mode === "audio" ? "♪ " : "") + j.title; t.title = j.title;
    el.querySelector(".bar").classList.toggle("indet", indet && active);
    el.querySelector(".bar > i").style.width = (j.status === "done" ? 100 : (j.percent || 0)) + "%";
    if (j.status === "error") el.querySelector(".small").innerHTML = line;
    else el.querySelector(".small").textContent = line;
  }
  if (jobs.some(j => ["queued","downloading","processing"].includes(j.status))) timer = setTimeout(poll, 600);
}
// One delegated listener, so re-renders never drop a click.
$("#jobs").addEventListener("click", e => {
  const c = e.target.closest("[data-cancel]"), r = e.target.closest("[data-reveal]");
  if (c) { c.disabled = true; c.textContent = "Cancelling…"; api("/api/cancel", { id: c.dataset.cancel }).then(poll); }
  if (r) api("/api/reveal", { path: r.dataset.reveal });
});
$("#clear").onclick = () => api("/api/clear", {}).then(poll);

// ---------- settings ----------
async function loadSettings() {
  const s = await api("/api/settings");
  $("#folder").textContent = s.folder; $("#folder").title = s.folder;
  $("#cookies").value = s.cookies || "none";
  state.ffmpeg = s.ffmpeg;
  $("#ver").textContent = "Engine: yt-dlp " + s.version + (s.ffmpeg ? " · ffmpeg found" : " · ffmpeg missing (limited formats)");
}
$("#choose").onclick = async () => { const r = await api("/api/choose-folder", {});
  $("#folder").textContent = r.folder; $("#folder").title = r.folder; };
$("#openFolder").onclick = () => api("/api/reveal", {});
$("#cookies").onchange = e => api("/api/settings", { cookies: e.target.value });
$("#update").onclick = async () => {
  $("#update").disabled = true; $("#update").textContent = "Updating…";
  const r = await api("/api/update", {});
  $("#update").textContent = r.ok ? "Updated" : "Update failed";
  $("#ver").textContent = r.message;
};

loadSettings(); poll();
</script>
</body>
</html>
